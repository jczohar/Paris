<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {

	}
.leaflet-popup-pane,
.leaflet-control {

.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;

	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

.leaflet-bar a:first-child {

	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;

	}
.leaflet-touch .leaflet-bar a:last-child {

	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {

.leaflet-control-layers-toggle {

.leaflet-control-layers .leaflet-control-layers-list,

.leaflet-control-layers-expanded .leaflet-control-layers-list {

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-control-scale-line:not(:first-child) {

	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {

	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {

	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);

	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;

	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;

	position: absolute;

	}
.leaflet-popup-tip {
	width: 17px;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;

	}
.leaflet-container a.leaflet-popup-close-button {

	}
.leaflet-container a.leaflet-popup-close-button:hover,

	}
.leaflet-popup-scrolled {

	}

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {
	width: 24px;

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);
	}

.leaflet-oldie .leaflet-control-zoom,
.leaflet-oldie .leaflet-control-layers,
.leaflet-oldie .leaflet-popup-content-wrapper,

	}


/* div icon */

.leaflet-div-icon {
	background: #fff;
	border: 1px solid #666;
	}


/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip-bottom:before,

.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;
	margin-left: -6px;
	}

}

<style>:root{--navy:#17235f;--blue:#2447c8;--gold:#f5c542;--rose:#e63e6d;--mint:#10b5a0;--vio:#7b3fe4;--bg:#f3f0fb;--card:#fff;--ink:#1d2140;--mut:#6a6f8f;--line:#e2def2;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink);direction:rtl;font-size:15px;line-height:1.45;padding-bottom:30px}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
#top{background:linear-gradient(100deg,#17235f 0%,#3a2a9c 55%,#8b2fb8 100%);color:#fff;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:44px;position:sticky;top:0;z-index:1100;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#top .emb{width:32px;height:32px;flex:none}
#top .ttl{flex:1;min-width:0;line-height:1.15}
#top .ttl b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl span{font-size:11px;opacity:.95}
.gold{color:var(--gold);font-weight:700;letter-spacing:.2px;text-shadow:0 0 6px rgba(245,197,66,.45)}
#top button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;padding:6px 9px;font-size:16px}
#wx{background:linear-gradient(90deg,#fff4d6,#ffe1ea 50%,#e2e9ff);padding:6px 8px;display:flex;gap:8px;align-items:stretch;border-bottom:1px solid var(--line)}
#wx .cur{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:4px 9px;box-shadow:0 1px 4px rgba(0,0,0,.1);min-width:104px}
#wx .cur .big{font-size:26px;line-height:1}
#wx .cur .t{font-size:20px;font-weight:700}
#wx .cur small{display:block;color:var(--mut);font-size:11px;line-height:1.1}
#wxdays{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:thin}
.wd{flex:none;background:#fff;border-radius:10px;padding:3px 7px;text-align:center;min-width:62px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.wd b{display:block;font-size:12px}.wd .em{font-size:19px}.wd .tt{font-weight:700;font-size:12px}.wd .pp{color:#2863d9}
#todayBtn{flex:none;border:0;border-radius:12px;background:linear-gradient(135deg,var(--rose),#ff8a3d);color:#fff;font-weight:700;padding:6px 10px;box-shadow:0 2px 6px rgba(230,62,109,.4);font-size:13px;white-space:normal;max-width:96px;line-height:1.15}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#fff;position:sticky;top:44px;z-index:1000;border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs button{flex:none;border:0;border-radius:999px;padding:8px 13px;background:#efeafd;color:var(--navy);font-weight:600;font-size:14px;white-space:nowrap}
#tabs button.on{background:linear-gradient(135deg,var(--blue),var(--vio));color:#fff;box-shadow:0 2px 8px rgba(80,60,200,.4)}
main{padding:10px;max-width:1100px;margin:0 auto}
h2{margin:6px 0 8px;font-size:20px;color:var(--navy)}
h3{margin:12px 0 6px;font-size:16px;color:var(--navy)}
.note{background:#fff8e1;border:1px solid #f4dc8a;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.blue{background:#e9efff;border-color:#bfcdfb}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.btn{border:0;border-radius:11px;padding:8px 12px;background:linear-gradient(135deg,var(--blue),var(--vio));color:#fff;font-weight:600;font-size:14px;text-decoration:none;display:inline-block}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.rose{background:linear-gradient(135deg,var(--rose),#ff8a3d)}
.btn.mint{background:linear-gradient(135deg,var(--mint),#2ad0a5)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:9px}
.btn.red{background:#d33;}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:7px 11px;font-size:13px;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fbar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px;margin:8px 0}
.fbar input[type=search],.fbar input[type=text],.fbar select,input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:9px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink)}
.fbar input[type=search]{width:100%;margin-bottom:5px}
.fbar .lab{font-size:12px;color:var(--mut);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(60,40,140,.12);overflow:hidden;border-top:4px solid var(--vio);display:flex;flex-direction:column}
.card.c1{border-top-color:var(--rose)}.card.c2{border-top-color:var(--mint)}.card.c3{border-top-color:var(--gold)}.card.c4{border-top-color:var(--blue)}
.card.closed{opacity:.6}
.ph{height:160px;background:linear-gradient(135deg,#dfe6ff,#ffe1ec);display:flex;align-items:center;justify-content:center;font-size:46px;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cr{position:absolute;bottom:2px;left:4px;font-size:9px;color:#fff;background:rgba(0,0,0,.4);padding:0 4px;border-radius:4px}
.ph .rk{position:absolute;top:6px;right:6px;background:var(--navy);color:#fff;border-radius:999px;padding:1px 8px;font-size:12px}
.cb{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:5px}
.cb h4{margin:0;font-size:17px;color:var(--navy)}
.cb .sub{color:var(--mut);font-size:12px;direction:ltr;text-align:right}
.tag{display:inline-block;background:#efeafd;color:var(--navy);border-radius:999px;padding:1px 8px;font-size:11px;margin:1px}
.tag.gold{background:#fff1c2}.tag.red{background:#ffdce3;color:#a3123a}.tag.green{background:#d9f7ee;color:#0a6a58}
.kv{font-size:13px;margin:2px 0}
.kv b{color:var(--navy)}
.more{display:none;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-size:13px}
.card.open .more{display:block}
.act{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.star{border:0;background:none;font-size:20px;padding:0 2px}
.map{height:360px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);position:relative;z-index:1}
.mapwrap{position:relative;background:#fff;border-radius:var(--r)}
.mapwrap.fs{position:fixed;inset:0;z-index:3000;border-radius:0}
.mapwrap.fs .map,.mapwrap.fs iframe{height:100vh!important;border-radius:0}
.mapwrap iframe{width:100%;height:360px;border:0;border-radius:var(--r)}
.fsx{position:absolute;top:8px;left:8px;z-index:1500;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.25)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.pin span{transform:rotate(45deg);font-size:15px}
.num{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mapinfo{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:9px;margin:8px 0}
.leaflet-container{font-family:inherit;direction:ltr}
.modal{position:fixed;inset:0;background:rgba(10,12,40,.55);z-index:4000;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;border-radius:18px 18px 0 0;max-height:88vh;width:100%;max-width:760px;overflow:auto;padding:12px 14px 22px;animation:up .2s}
@media(min-width:760px){.modal{align-items:center}.modal .box{border-radius:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal .hd{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-12px;background:#fff;padding:6px 0;z-index:2}
.modal .hd b{font-size:18px;color:var(--navy)}
.x{border:0;background:#efeafd;border-radius:50%;width:32px;height:32px;font-size:16px}
.pickgrp{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pickgrp>b{display:block;background:#efeafd;padding:7px 10px;color:var(--navy)}
.pickitem{display:block;width:100%;text-align:right;border:0;border-top:1px solid var(--line);background:#fff;padding:8px 10px}
.pickitem:hover{background:#f6f2ff}
.pickitem small{color:var(--mut);display:block}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
table.t th{background:var(--navy);color:#fff;padding:7px;text-align:right}
table.t td{padding:7px;border-top:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:#faf8ff}
.lb{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:12px;padding:0 6px;font-weight:700;font-size:12px;margin:1px}
.acc{background:#fff;border-radius:12px;border:1px solid var(--line);margin:7px 0;overflow:hidden}
.acc>button{width:100%;text-align:right;border:0;background:linear-gradient(90deg,#f7f3ff,#fff);padding:10px 12px;font-weight:700;color:var(--navy);font-size:15px;display:flex;justify-content:space-between}
.acc .bd{display:none;padding:4px 14px 10px}
.acc.open .bd{display:block}
.acc ul{margin:4px 0;padding-right:20px}
.acc li{margin:4px 0}
.df{position:relative;display:inline-flex;align-items:center;direction:ltr;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden}
.df input[type=text]{border:0;padding:7px 8px;width:112px;font:inherit;outline:0;text-align:right;direction:ltr;background:transparent}
.df input.bad{background:#ffe3e3}
.calbtn{position:relative;display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;background:#efeafd;cursor:pointer}
.calbtn .nat{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.stop{background:#fff;border:1px solid var(--line);border-right:5px solid var(--vio);border-radius:12px;padding:8px 10px;margin:6px 0}
.stop .tm{font-weight:700;color:var(--blue)}
.leg{margin:2px 14px;color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dayhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(90deg,#efeafd,#fff);padding:8px 10px;border-radius:12px;margin-top:12px}
.dayhd b{color:var(--navy);font-size:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:12px;padding:9px 16px;z-index:6000;max-width:90%;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.hide{display:none!important}
.lbl{font-size:12px;color:var(--mut);display:block;margin-top:6px}
textarea.in{width:100%;min-height:50px}
.full{position:fixed;inset:0;background:linear-gradient(135deg,#17235f,#8b2fb8);color:#fff;z-index:9000;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px}
.phrase td:nth-child(3){direction:ltr;text-align:left}
.sp{flex:1}
.kidsrow{display:flex;gap:6px;flex-wrap:wrap}
@media print{
 body.printing #top,body.printing #wx,body.printing #tabs,body.printing .noprint,body.printing footer,body.printing .toast{display:none!important}
 .map{height:260px!important}
 body{background:#fff}
 .card,.stop{break-inside:avoid}
}

footer{margin:16px 10px;text-align:center;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header id="top">
  <svg class="emb" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="#f5c542"/><circle cx="32" cy="32" r="27" fill="#17235f"/><path d="M32 9 L35 24 L38 24 L44 53 L38 53 L35 40 L29 40 L26 53 L20 53 L26 24 L29 24 Z" fill="#f5c542"/><rect x="25" y="31" width="14" height="2.5" fill="#17235f"/></svg>
  <div class="ttl"><b>פריז, צרפת – מידע למטייל</b><span>יוצר: <span class="gold">יעקב זוהר</span></span></div>
  <button id="refreshBtn" title="רענון">🔄</button>
</header>
<div id="wx"></div>
<nav id="tabs"></nav>
<main id="main"></main>
<footer>תמונות: ויקיפדיה / ויקימדיה קומונס · מפות: © OpenStreetMap · מחירים וטלפונים משוערים – כדאי לוודא באתרים הרשמיים<br><span id="ver"></span></footer>

const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
const pad = n => String(n).padStart(2,"0");
const fmtDMY = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const parseDMY = s => { const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||""); if(!m) return null; const d=new Date(+m[3],+m[2]-1,+m[1]); return d.getMonth()===+m[2]-1 ? d : null; };
const store = {
  get(k,def){ try{ const v=localStorage.getItem("paris_"+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem("paris_"+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem("paris_"+k); }catch(e){} }
};
function km(a,b){ const R=6371, rad=Math.PI/180, dLa=(b.lat-a.lat)*rad, dLo=(b.lng-a.lng)*rad;
  const x=Math.sin(dLa/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function toast(msg, ms=2600){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

/* ---------- שמירת קובץ עם בחירת שם ומיקום ---------- */
async function saveFile(suggested, blob, mime){
  const ext = "."+suggested.split(".").pop();
  if(window.showSaveFilePicker){
    try{
      const h = await window.showSaveFilePicker({ suggestedName:suggested, types:[{description:"קובץ", accept:{[mime]:[ext]}}] });
      const w = await h.createWritable(); await w.write(blob); await w.close(); toast("הקובץ נשמר"); return true;
    }catch(e){ if(e && e.name==="AbortError") return false; }
  }
  let name = prompt("שם הקובץ לשמירה:", suggested); if(!name) return false;
  if(!name.toLowerCase().endsWith(ext)) name += ext;
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast("הקובץ נשמר בתיקיית ההורדות"); return true;
}

function bindDates(root=document){
  $$(".df",root).forEach(w=>{
    if(w._b) return; w._b=1;
    const t=$("input[type=text]",w), n=$(".nat",w);
    const fire=()=>t.dispatchEvent(new CustomEvent("datechange",{bubbles:true}));
    t.addEventListener("input",()=>{
      const v=t.value.replace(/\D/g,"").slice(0,8); let o=v.slice(0,2);
      if(v.length>2) o+="/"+v.slice(2,4); if(v.length>4) o+="/"+v.slice(4);
      t.value=o; const d=parseDMY(o); t.classList.toggle("bad", o.length===10 && !d);
      if(d) n.value=isoOf(d); fire();
    });
    n.addEventListener("change",()=>{ if(n.value){ t.value=fmtDMY(fromIso(n.value)); t.classList.remove("bad"); fire(); } });
    n.addEventListener("click",()=>{ try{ n.showPicker && n.showPicker(); }catch(e){} });
    const d0=parseDMY(t.value); if(d0) n.value=isoOf(d0);

}

(function singleInstance(){
  if(!("BroadcastChannel" in window)) return;
  const bc=new BroadcastChannel("paris_guide_single"), id=Math.random().toString(36).slice(2), start=Date.now();
  let blocked=false;
  bc.onmessage=e=>{
    const m=e.data||{};
    if(m.t==="ping" && m.id!==id && !blocked){
      bc.postMessage({t:"pong",to:m.id,ts:start});
      try{ window.focus(); }catch(_){}
      toast("האפליקציה כבר פתוחה כאן – ניסיון פתיחה נוסף הועבר לחלון הזה");
    } else if(m.t==="pong" && m.to===id && m.ts<start){
      blocked=true;
      document.body.insertAdjacentHTML("beforeend",`<div class="full"><div>🗼<br>האפליקציה כבר פתוחה בחלון אחר.<br><small>עברו לחלון הפתוח – החלון הזה ייסגר.</small></div></div>`);
      setTimeout(()=>{ try{ window.close(); }catch(_){} }, 700);
    }
  };
  setTimeout(()=>bc.postMessage({t:"ping",id}), 150);
})();

const WMO = c => c===0?["☀️","בהיר"]:c===1?["🌤️","בהיר ברובו"]:c===2?["⛅","מעונן חלקית"]:c===3?["☁️","מעונן"]:(c===45||c===48)?["🌫️","ערפל"]:(c>=51&&c<=57)?["🌦️","טפטוף"]:(c>=61&&c<=67)?["🌧️","גשם"]:(c>=71&&c<=77)?["🌨️","שלג"]:(c>=80&&c<=82)?["🌦️","ממטרים"]:(c===85||c===86)?["🌨️","שלג"]:(c>=95)?["⛈️","סופת רעמים"]:["🌡️","—"];
let WX = null;
async function loadWeather(force){
  const c=store.get("wx",null);
  if(!force && c && Date.now()-c.ts<30*60*1000){ WX=c.data; return WX; }
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${CITY.lat}&longitude=${CITY.lng}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FParis&forecast_days=16`;
    const r=await fetch(u); if(!r.ok) throw 0; WX=await r.json(); store.set("wx",{ts:Date.now(),data:WX});
  }catch(e){ if(c){ WX=c.data; WX._stale=true; } }
  return WX;
}
function weatherFor(iso){
  if(!WX||!WX.daily) return null; const i=WX.daily.time.indexOf(iso); if(i<0) return null;
  return { code:WX.daily.weather_code[i], tmax:WX.daily.temperature_2m_max[i], tmin:WX.daily.temperature_2m_min[i], pop:WX.daily.precipitation_probability_max[i] };
}
function weatherChip(iso){
  const w=weatherFor(iso); if(!w) return `<span class="tag">אין תחזית עדיין</span>`;
  const [e,t]=WMO(w.code); return `<span class="tag gold">${e} ${t} · ${Math.round(w.tmin)}°–${Math.round(w.tmax)}° · גשם ${w.pop??0}%</span>`;
}
function renderWeather(){
  const el=$("#wx"); if(!WX||!WX.current){ el.innerHTML=`<div class="cur"><span class="big">🌡️</span><div><small>מזג האוויר</small><small>לא זמין (אין חיבור)</small></div></div><button id="todayBtn">🧭 מה עושים היום</button>`; $("#todayBtn").onclick=()=>whatToday(); return; }
  const [e,t]=WMO(WX.current.weather_code);
  let days="";
  WX.daily.time.slice(0,7).forEach((iso,i)=>{
    const d=fromIso(iso), [ee]=WMO(WX.daily.weather_code[i]);
    days+=`<div class="wd" data-d="${iso}"><b>${i===0?"היום":"יום "+"אבגדהוש"[d.getDay()]+"׳"}</b>${fmtDMY(d).slice(0,5)}<div class="em">${ee}</div><div class="tt">${Math.round(WX.daily.temperature_2m_max[i])}° / ${Math.round(WX.daily.temperature_2m_min[i])}°</div><div class="pp">💧${WX.daily.precipitation_probability_max[i]??0}%</div></div>`;
  });
  el.innerHTML=`<div class="cur"><span class="big">${e}</span><div><span class="t">${Math.round(WX.current.temperature_2m)}°</span><small>${t} · מורגש ${Math.round(WX.current.apparent_temperature)}°</small><small>פריז עכשיו${WX._stale?" (נתון שמור)":""}</small></div></div><div id="wxdays">${days}</div><button id="todayBtn">🧭 מה עושים היום</button>`;
  $("#todayBtn").onclick=()=>whatToday();
  $$(".wd").forEach(x=>x.onclick=()=>whatToday(x.dataset.d));
}

const PH = store.get("photos",{});
async function fetchPhoto(w){
  if(!w) return null; if(PH[w]!==undefined) return PH[w];
  for(const lang of ["en","fr"]){
    try{
      const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(w.replace(/ /g,"_"))}`);
      if(r.ok){ const j=await r.json(); let u=(j.thumbnail&&j.thumbnail.source)||null; if(u) u=u.replace(/\/(\d+)px-/,"/640px-"); if(u){ PH[w]=u; store.set("photos",PH); return u; } }
      else if(r.status!==404) return undefined;
    }catch(e){ return undefined; }
  }
  PH[w]=null; store.set("photos",PH); return null;
}
const IO = "IntersectionObserver" in window ? new IntersectionObserver((es)=>{ es.forEach(en=>{ if(en.isIntersecting){ IO.unobserve(en.target); fillPhoto(en.target); } }); },{rootMargin:"200px"}) : null;
async function fillPhoto(el){
  const w=el.dataset.wiki; if(!w) return; const u=await fetchPhoto(w);
  if(u){ el.insertAdjacentHTML("afterbegin",`<img loading="lazy" alt="" src="${u}" onerror="this.remove()"><span class="cr">Wikipedia</span>`); }
}
function photo(wiki, emoji, extra=""){

}
function hydratePhotos(root=document){ $$(".ph[data-wiki]:not([data-h])",root).forEach(el=>{ el.dataset.h=1; IO?IO.observe(el):fillPhoto(el); }); }

const views = {};
const EMOJI = { icon:"🗼", museum:"🖼️", church:"⛪", park:"🌳", district:"🏘️", show:"🎭", daytrip:"🚆" };
const SHORT = s => s.length>130 ? s.slice(0,127)+"…" : s;
let PENDING = null; // {k,id} להצגה במפה
function gotoMap(k,id){ PENDING={k,id}; showTab("map"); }
function tel(p){ return p?`<a href="tel:${p.replace(/\s/g,"")}">${esc(p)}</a>`:"—"; }
function webA(u){ return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))}</a>`:"—"; }
function kv(l,v){ return v?`<div class="kv"><b>${l}:</b> ${v}</div>`:""; }
function bindCards(root, rerender){
  $$(".more-btn",root).forEach(b=>b.onclick=()=>{ const c=b.closest(".card"); c.classList.toggle("open"); b.textContent=c.classList.contains("open")?"▲ הסתר פרטים":"▼ הרחב מידע"; });
  $$("[data-fav]",root).forEach(b=>b.onclick=()=>{ b.textContent=FAV.toggle(b.dataset.fav)?"⭐":"☆"; });
  $$("[data-hide]",root).forEach(b=>b.onclick=()=>{ HID.toggle(b.dataset.hide); toast("הוסתר זמנית – לחצו ״הצג מוסתרים״ לשחזור"); rerender&&rerender(); });
  $$("[data-map]",root).forEach(b=>b.onclick=()=>{ const [k,id]=b.dataset.map.split(":"); gotoMap(k,id); });
  hydratePhotos(root);
}

/* ---------- מפה ואתרים ---------- */
views.map = function(root){
  root.innerHTML = `<h2>🗺️ מפת העיר ואתרים</h2>
  <div class="bar"><button class="btn rose" id="pick">📍 בחר מקום במפה</button>
   <span class="seg" id="mt"><button class="on" data-m="osm">מפה אינטראקטיבית</button><button data-m="g">Google Maps</button></span>
   <button class="btn alt sm" id="meBtn">📡 המיקום שלי</button></div>
  <div class="mapwrap" id="mw"><div id="map" class="map"></div><iframe id="gm" class="hide" title="Google Maps" loading="lazy"></iframe></div>
  <div id="mapinfo"></div>
  <h3>אתרים ואטרקציות – לפי חשיבות</h3>
  <div id="sfb"></div><div class="grid" id="slist"></div>`;
  const map = makeMap($("#map"), [48.8606,2.3376], 12), mw=$("#mw"); addFsButton(mw,map);
  let layer = L.layerGroup().addTo(map), focusLayer=L.layerGroup().addTo(map), routeLayer=L.layerGroup().addTo(map), mode="osm", cur=null, meMarker=null;
  const gm=$("#gm");
  setTimeout(()=>map.invalidateSize(),150);

  /* סינון */
  const def = {
    groups:[{id:"cat",label:"קטגוריה",opts:Object.entries(CATS)},{id:"int",label:"תחום עניין",opts:Object.entries(INTERESTS)}],
    toggles:[["open","🟢 פתוח היום"],["free","🆓 חינם"],["indoor","☔ מקורה"],["kids","👨‍👩‍👧 מתאים לילדים"],["adv","🎟️ להזמין מראש"],["fav","⭐ רק מועדפים"],["showhid","👁️ הצג מוסתרים"]],
    sorts:[["rank","לפי חשיבות"],["near","הקרוב אליי"],["cost","מחיר (זול קודם)"],["dur","משך ביקור (קצר קודם)"]]
  };
  $("#sfb").innerHTML = filterBarHtml("sites", def);
  function list(){
    const st=fstate("sites"), fav=FAV.get(), hid=HID.get(), wd=new Date().getDay();
    let a = SITES.filter(s=>{
      if(!st.t.has("showhid") && hid.has(s.id)) return false;
      if(!textMatch(st.q,s.he,s.en,s.fr,s.desc,s.addr,s.area)) return false;
      const gc=st.g.cat; if(gc&&gc.size&&!gc.has(s.cat)) return false;
      const gi=st.g.int; if(gi&&gi.size&&!s.tags.some(t=>gi.has(t))) return false;
      if(st.t.has("open")&&!isOpenOn(s,wd)) return false;
      if(st.t.has("free")&&s.cost>0) return false;
      if(st.t.has("indoor")&&!s.indoor) return false;
      if(st.t.has("kids")&&!s.kids) return false;
      if(st.t.has("adv")&&!s.advance) return false;
      if(st.t.has("fav")&&!fav.has(s.id)) return false;
      return true;
    });
    const ref = ME||{lat:CITY.lat,lng:CITY.lng};
    if(st.sort==="rank") a.sort((x,y)=>x.rank-y.rank); else if(st.sort==="near") a.sort((x,y)=>km(ref,x)-km(ref,y)); else if(st.sort==="cost") a.sort((x,y)=>x.cost-y.cost||x.rank-y.rank); else a.sort((x,y)=>x.dur-y.dur);
    $(".fcount",$("#sfb")).textContent = a.length+" תוצאות";
    $("#slist").innerHTML = a.map(s=>siteCard(s,fav,hid,wd)).join("") || `<div class="note">אין תוצאות. נסו לנקות את הסינון.</div>`;
    bindCards($("#slist"), list);
    $$("[data-pick]", $("#slist")).forEach(b=>b.onclick=()=>{ focus(allPlaces().find(p=>p.k==="sites"&&p.id===b.dataset.pick)); mw.scrollIntoView({behavior:"smooth",block:"start"}); });
    drawMarkers(a);
  }
  function drawMarkers(a){
    layer.clearLayers();
    a.forEach(s=>{ if(s.status==="closed") return; const mk=L.marker([s.lat,s.lng],{icon:pinIcon("#e63e6d",EMOJI[s.cat]||"📍")}).addTo(layer);
      mk.bindPopup(`<b>${esc(s.he)}</b><br><small>${esc(s.en)}</small><br><a href="#" data-pp="${s.id}">פרטים ומסלול</a>`);
      mk.on("popupopen",e=>{ const a2=e.popup.getElement().querySelector("[data-pp]"); if(a2) a2.onclick=ev=>{ ev.preventDefault(); focus(allPlaces().find(p=>p.k==="sites"&&p.id===s.id)); }; });
    });
  }
  bindFilterBar(root,"sites",list); list();

  /* מצב מפה */
  $$("#mt button").forEach(b=>b.onclick=()=>{ mode=b.dataset.m; $$("#mt button").forEach(x=>x.classList.toggle("on",x===b)); applyMode(); });
  function applyMode(){
    const g = mode==="g";
    $("#map").classList.toggle("hide",g); gm.classList.toggle("hide",!g);
    if(g){ const p=cur||{lat:48.8606,lng:2.3376}; gm.src=`https://maps.google.com/maps?q=${p.lat},${p.lng}&z=${cur?15:12}&output=embed`; }
    else setTimeout(()=>map.invalidateSize(),100);
  }
  /* בחירת מקום */
  $("#pick").onclick=()=>{
    const ps=allPlaces(), groups={}; ps.forEach(p=>(groups[p.kind]=groups[p.kind]||[]).push(p));
    const html=`<input type="search" class="in" id="pq" placeholder="🔎 חיפוש מקום..." style="width:100%;margin-bottom:6px">`+Object.entries(groups).map(([k,a],i)=>`<div class="pickgrp"><b>${a[0].emoji} ${k} (${a.length})</b><div class="pl">${a.map(p=>`<button class="pickitem" data-k="${p.k}" data-id="${p.id}"><span>${esc(p.name)}</span><small>${esc(p.sub||"")}</small></button>`).join("")}</div></div>`).join("");
    openModal("בחר מקום במפה", html, mb=>{
      $$(".pickitem",mb).forEach(b=>b.onclick=()=>{ const p=ps.find(x=>x.k===b.dataset.k&&String(x.id)===b.dataset.id); closeModal(); focus(p); });
      $("#pq",mb).oninput=e=>{ const q=e.target.value.toLowerCase(); $$(".pickitem",mb).forEach(b=>b.classList.toggle("hide",q&&!b.textContent.toLowerCase().includes(q))); };
    });
  };
  $("#meBtn").onclick=async()=>{
    try{ const me=await getMe(); if(meMarker) map.removeLayer(meMarker); meMarker=L.circleMarker([me.lat,me.lng],{radius:8,color:"#fff",fillColor:"#1a73e8",fillOpacity:1,weight:3}).addTo(map).bindPopup("אתם כאן"); map.setView([me.lat,me.lng],14); toast("המיקום עודכן"); list(); }
    catch(e){ toast("לא הצלחנו לאתר את המיקום. אשרו גישה למיקום בהגדרות המכשיר."); }
  };
  /* התמקדות במקום */
  function focus(p){
    if(!p) return; cur=p; focusLayer.clearLayers(); routeLayer.clearLayers();
    L.marker([p.lat,p.lng],{icon:pinIcon("#17235f",p.emoji),zIndexOffset:1000}).addTo(focusLayer).bindPopup(`<b>${esc(p.name)}</b>`).openPopup();
    map.setView([p.lat,p.lng],16);
    const ns=nearestStation(p);
    const site = p.k==="sites" ? SITES.find(s=>s.id===p.id) : null;
    $("#mapinfo").innerHTML = `<div class="mapinfo"><b style="font-size:17px">${p.emoji} ${esc(p.name)}</b><div class="sub" style="color:var(--mut)">${esc(p.sub||"")}</div>
      <div class="kv"><b>כתובת:</b> ${esc(p.addr||"")}</div>
      <div class="kv"><b>תחנת מטרו קרובה:</b> ${esc(ST[ns.id][0])} (קווים ${linesAt(ns.id).join(", ")}) – כ-${Math.round(ns.d*1000)} מ׳ בקו אווירי</div>
      <div class="act"><a class="btn sm" target="_blank" rel="noopener" href="${gmapSearch(p.lat,p.lng)}">פתח ב-Google Maps</a><a class="btn sm mint" target="_blank" rel="noopener" href="${gmapDir(p)}">ניווט בתחבורה ציבורית</a><a class="btn sm alt" target="_blank" rel="noopener" href="${gmapDir(p,null,"walking")}">ניווט בהליכה</a>${site?`<button class="btn sm alt" id="sdet">פרטי האתר ↓</button>`:""}</div>
      <h3 style="margin:8px 0 2px">מסלול הגעה</h3>
      <div class="two"><select id="orig" class="in"><option value="gps">📡 מהמיקום הנוכחי שלי</option><optgroup label="ממקום אחר">${allPlaces().map(x=>`<option value="${x.k}:${x.id}">${esc(x.kind+" – "+x.name)}</option>`).join("")}</optgroup></select><button class="btn" id="goRoute">הצג מסלול על המפה</button></div><div id="routeRes"></div></div>`;
    if(site){ const b=$("#sdet"); b.onclick=()=>{ const el=$(`[data-id="${site.id}"]`,$("#slist")); if(el){ el.classList.add("open"); el.scrollIntoView({behavior:"smooth",block:"center"}); } else toast("האתר מוסתר/מסונן – נקו סינון."); }; }
    $("#goRoute").onclick=async()=>{
      const v=$("#orig").value; let o;
      if(v==="gps"){ try{ o=await getMe(); }catch(e){ toast("לא ניתן לקבל מיקום – בחרו מקום אחר מהרשימה."); return; } o.name="המיקום שלי"; }
      else { const [k,id]=v.split(":"); o=allPlaces().find(x=>x.k===k&&String(x.id)===id); }
      routeLayer.clearLayers(); L.polyline([[o.lat,o.lng],[p.lat,p.lng]],{color:"#e63e6d",weight:5,dashArray:"9 8"}).addTo(routeLayer);
      L.marker([o.lat,o.lng],{icon:pinIcon("#10b5a0","🚩")}).addTo(routeLayer);
      map.fitBounds([[o.lat,o.lng],[p.lat,p.lng]],{padding:[40,40]});
      const d=km(o,p), walk=Math.round(d*1.3/4.5*60), metro=Math.round(12+d*1.25/0.45*0.6), taxi=Math.round(6+d*1.4/0.3*0.5);
      $("#routeRes").innerHTML=`<div class="note blue">מרחק בקו אווירי כ-${d.toFixed(1)} ק״מ. הערכה: הליכה ≈ ${walk} דק׳ · תחבורה ציבורית ≈ ${Math.max(metro,5)} דק׳ · מונית ≈ ${Math.max(taxi,5)} דק׳.<br>הקו על המפה ישר (להערכה). למסלול מדויק צעד אחר צעד: <a target="_blank" rel="noopener" href="${gmapDir(p,o.name==="המיקום שלי"?o:o,"transit")}">פתח ב-Google Maps</a>.</div>`;
      if(mode==="g") gm.src=`https://maps.google.com/maps?saddr=${o.lat},${o.lng}&daddr=${p.lat},${p.lng}&dirflg=r&output=embed`;
    };
    if(mode==="g") applyMode();
  }
  if(PENDING){ const p=allPlaces().find(x=>x.k===PENDING.k&&String(x.id)===PENDING.id); PENDING=null; setTimeout(()=>{ focus(p); },200); }
};
function siteCard(s, fav, hid, wd){
  const open=isOpenOn(s,wd), c = s.rank%5;
  const tags=[`<span class="tag">${CATS[s.cat]}</span>`, s.cost===0?`<span class="tag green">חינם</span>`:"", s.advance?`<span class="tag gold">להזמין מראש</span>`:"", s.status==="closed"?`<span class="tag red">סגור לשיפוץ</span>`:(!open?`<span class="tag red">סגור היום</span>`:""), s.indoor?`<span class="tag">מקורה</span>`:`<span class="tag">בחוץ</span>`, s.dur?`<span class="tag">⏱️ כ-${s.dur} שע׳</span>`:"", hid.has(s.id)?`<span class="tag red">מוסתר</span>`:""].join("");
  return `<div class="card c${c} ${open?"":"closed"}" data-id="${s.id}">${photo(s.wiki,EMOJI[s.cat],s.rank<99?`<span class="rk">#${s.rank}</span>`:"")}
  <div class="cb"><div style="display:flex;align-items:center;gap:2px"><h4 style="flex:1">${esc(s.he)}</h4><button class="star" data-fav="${s.id}" title="מעניין אותי">${fav.has(s.id)?"⭐":"☆"}</button><button class="star" data-hide="${s.id}" title="הסתר זמנית">🚫</button></div>
  <div class="sub">${esc(s.en)}${s.fr&&s.fr!==s.en?" · "+esc(s.fr):""}</div><div>${tags}</div>
  <div>${esc(s.desc)}</div>
  <div class="more"><div class="kv">${esc(s.more)}</div>
   ${kv("כתובת",esc(s.addr))}${kv("טלפון",s.phone?tel(s.phone):"אין מוקד טלפוני מומלץ – ההזמנה והמידע באתר")}${kv("אתר",webA(s.web))}
   ${kv("ימים ושעות",esc(s.hours))}${kv("מחיר",esc(s.price))}${kv("כניסה חופשית/הנחות",esc(s.free))}${kv("רכישת כרטיסים",esc(s.tickets))}${kv("איך מגיעים",esc(s.how))}
  </div>
  <div class="act"><button class="btn sm alt more-btn">▼ הרחב מידע</button><button class="btn sm" data-pick="${s.id}">📍 הצג במפה</button><a class="btn sm mint" target="_blank" rel="noopener" href="${gmapDir(s)}">ניווט</a>${s.web?`<a class="btn sm alt" target="_blank" rel="noopener" href="${esc(s.web)}">אתר</a>`:""}</div></div></div>`;
}

/* ---------- מלונות ---------- */
function priceNum(str){ const m=/(\d[\d,]*)/.exec(str||""); return m?+m[1].replace(/,/g,""):0; }
views.hotels = function(root){
  root.innerHTML = `<h2>🛏️ מלונות מומלצים (4–5 כוכבים)</h2><div class="note">המחירים משוערים ללילה בחדר זוגי, ומשתנים לפי עונה וביקוש. ארוחת הבוקר בדרך כלל אינה כלולה במחיר החדר ביוקרה – ההערכה מציינת את התוספת. לבדיקת מחיר עדכני והזמנה היכנסו לאתר המלון.</div>
  <div id="hfb"></div><div class="grid" id="hlist"></div>`;
  $("#hfb").innerHTML=filterBarHtml("hotels",{groups:[{id:"st",label:"כוכבים",opts:[["5","5★"],["4","4★"]]},{id:"ar",label:"אזור",opts:[["1er","1er – לובר/אופרה"],["8e","8e – שאנז אליזה"],["6e","6e – סן ז׳רמן"],["7e","7e – אייפל"],["3e","3e – מארה"],["15e","15e"],["16e","16e"],["9e","9e"]]}],sorts:[["name","לפי שם"],["pasc","מחיר (זול קודם)"],["pdesc","מחיר (יקר קודם)"]]});
  function list(){
    const st=fstate("hotels"); let a=HOTELS.filter(h=>textMatch(st.q,h.he,h.area,h.why,h.addr)&&(!(st.g.st&&st.g.st.size)||st.g.st.has(String(h.stars)))&&(!(st.g.ar&&st.g.ar.size)||[...st.g.ar].some(x=>h.area.startsWith(x)||h.area.includes(x))));
    if(st.sort==="pasc") a.sort((x,y)=>priceNum(x.price)-priceNum(y.price)); else if(st.sort==="pdesc") a.sort((x,y)=>priceNum(y.price)-priceNum(x.price));
    $(".fcount",$("#hfb")).textContent=a.length+" תוצאות";
    $("#hlist").innerHTML=a.map((h,i)=>`<div class="card c${i%5}">${photo(h.wiki,"🏨")}<div class="cb"><h4>${esc(h.he)}</h4><div><span class="tag gold">${"★".repeat(h.stars)}</span><span class="tag">${esc(h.area)}</span></div><div>${esc(h.why)}</div>
      ${kv("מחיר משוער",esc(h.price))}${kv("כתובת",esc(h.addr))}${kv("טלפון",tel(h.phone))}${kv("אתר",webA(h.web))}${kv("קרבה לתחנות",esc(h.near))}
      <div class="act"><button class="btn sm" data-map="hotels:${h.id}">📍 במפה</button><a class="btn sm mint" target="_blank" rel="noopener" href="${gmapDir(h)}">ניווט</a></div></div></div>`).join("")||`<div class="note">אין תוצאות.</div>`;
    bindCards($("#hlist"));
  }
  bindFilterBar(root,"hotels",list); list();
};

      ${kv("מחיר",esc(r.price))}${kv("כתובת",esc(r.addr))}${kv("טלפון",r.phone?tel(r.phone):"—")}${kv("אתר",webA(r.web))}

    bindCards($("#rlist"));

  bindFilterBar(root,"rest",list); list();
};

/* ---------- קניות ---------- */
views.shop = function(root){

/* ===== תחבורה, טיפים, אזורי לינה, אירועים, מה עושים היום ===== */
let GRAPH=null;
function buildGraph(){
  const adj={}, add=(a,b,w)=>{ (adj[a]=adj[a]||[]).push([b,w]); };
  LINES.forEach(l=>{ for(let i=0;i<l.st.length-1;i++){ const a=l.st[i],b=l.st[i+1]; const d=km({lat:ST[a][1],lng:ST[a][2]},{lat:ST[b][1],lng:ST[b][2]}); const w=d*1000/(l.id.startsWith("RER")?700:480)+0.8; add(a+"|"+l.id,b+"|"+l.id,w); add(b+"|"+l.id,a+"|"+l.id,w); } });
  const by={}; LINES.forEach(l=>l.st.forEach(s=>{ (by[s]=by[s]||[]).push(s+"|"+l.id); }));
  Object.values(by).forEach(ns=>ns.forEach(a=>ns.forEach(b=>{ if(a!==b) add(a,b,4.5); })));
  GRAPH={adj,by};
}
function planRoute(fromSt,toSt){
  if(!GRAPH) buildGraph();
  const {adj,by}=GRAPH; const dist={},prev={},done=new Set();
  (by[fromSt]||[]).forEach(n=>dist[n]=3);
  const nodes=Object.keys(adj);
  while(true){
    let u=null,best=1e9; for(const n in dist){ if(!done.has(n)&&dist[n]<best){best=dist[n];u=n;} }
    if(u===null) break; done.add(u); if(u.split("|")[0]===toSt) { return rebuild(u); }
    (adj[u]||[]).forEach(([v,w])=>{ if(dist[v]===undefined||dist[u]+w<dist[v]){ dist[v]=dist[u]+w; prev[v]=u; } });
  }
  return null;
  function rebuild(end){ const path=[end]; while(prev[path[0]]) path.unshift(prev[path[0]]); return {path,total:dist[end]}; }
}
function describePath(res){
  const legs=[]; let cur=null;
  res.path.forEach((n,i)=>{ const [s,l]=n.split("|"); if(!cur||cur.line!==l){ if(cur) cur.to=res.path[i-1].split("|")[0]; cur={line:l,from:s,to:s,stops:[s]}; legs.push(cur); } else cur.stops.push(s); });
  legs.forEach(l=>{ l.to=l.stops[l.stops.length-1]; });
  return legs.filter(l=>l.from!==l.to||legs.length===1);
}
const legDir=(L0,leg)=>{ const li=LINES.find(x=>x.id===leg.line); const a=li.st.indexOf(leg.from), b=li.st.indexOf(leg.to); return b>a?li.ends[1]:li.ends[0]; };
const lineBadge=id=>{ const l=LINES.find(x=>x.id===id); return `<span class="lb" style="background:${l.color};color:${l.txt}">${id.replace("RER ","RER ")}</span>`; };

/* ===== מסלולים: יצירה, עריכה, שמירה, הדפסה ושיתוף ===== */
const MODES = { walk:["🚶","הליכה"], metro:["🚇","מטרו"], bus:["🚌","אוטובוס"], taxi:["🚕","מונית"], car:["🚗","רכב"], rer:["🚆","רכבת RER"] };
const PACE = { relaxed:["רגוע (2–3 אתרים ביום)",3], normal:["בינוני (3–4 אתרים)",4], busy:["אינטנסיבי (5 אתרים)",5] };
const uid = () => Math.random().toString(36).slice(2,9);
function legMinutes(mode,d){
  const m={ walk:d*1.3/4.5*60, metro:10+d*3.4, bus:8+d*6, taxi:5+d*4.2, car:10+d*4.2, rer:10+d*2.2 }[mode]; return Math.max(2,Math.round(m));
}
function autoMode(d,o){
  if(d>12) return "rer"; if(d<(o.walk==="low"?0.5:0.9)) return "walk"; if(o.kidAge==="0-5"&&o.kids>0&&d<2) return "taxi"; return "metro";
}
const hm=t=>`${pad(Math.floor(t/60)%24)}:${pad(t%60)}`, toMin=s=>{ const [h,m]=String(s||"09:30").split(":").map(Number); return h*60+(m||0); };

function genRoute(o){
  const hotel=HOTELS.find(h=>h.id===o.hotel), org=hotel?{name:hotel.he,lat:hotel.lat,lng:hotel.lng}:{name:"מרכז העיר (ליד הלובר)",lat:48.8606,lng:2.3376};
  const hasKids=o.kids>0, young=hasKids&&["0-5","6-12"].includes(o.kidAge), start=o.start?fromIso(o.start):null;
  const per=(PACE[o.pace]||PACE.normal)[1], used=new Set(), usedR=new Set(), wdOf=i=>start?new Date(start.getFullYear(),start.getMonth(),start.getDate()+i).getDay():null;
  const score=s=>100-s.rank*1.8+s.tags.filter(t=>o.interests.includes(t)).length*18+(hasKids&&s.kids?6:0)-(o.walk==="low"&&s.walk===3?10:0)-(hasKids&&!s.kids?12:0);
  const excl=s=>s.status==="closed"||(young&&["catacombs","moulinrouge","pere","shoah"].includes(s.id))||(hasKids&&s.id==="moulinrouge"&&o.kidAge!=="13-17");
  const pool=SITES.filter(s=>!excl(s)&&s.cat!=="daytrip").sort((a,b)=>score(b)-score(a));
  const trips=[]; const tripIds=[];
  if(o.days>=3) tripIds.push("versailles"); if(hasKids&&o.days>=4) tripIds.push("disney");
  if(o.days>=6&&(o.interests.includes("art")||o.interests.includes("nature"))&&(!start||(start.getMonth()>=3&&start.getMonth()<=9))) tripIds.push("giverny");
  const days=[]; for(let i=0;i<o.days;i++) days.push({date:start?isoOf(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i)):"",stops:[],note:""});
  tripIds.forEach(id=>{ const s=SITES.find(x=>x.id===id); for(let i=o.days-1;i>=1;i--){ if(days[i].stops.length||days[i].trip) continue; const wd=wdOf(i); if(wd!==null&&!isOpenOn(s,wd)) continue; days[i].trip=id; days[i].stops=[stopFromSite(s,{})]; break; } });
  days.forEach((day,i)=>{
    if(day.trip) return; const wd=wdOf(i);
    let avail=pool.filter(s=>!used.has(s.id)&&(wd===null||isOpenOn(s,wd)));
    let chosen=[];
    if(avail.length){ const seed=avail[0]; chosen=[seed]; const rest=avail.slice(1).sort((a,b)=>km(seed,a)-km(seed,b)); while(chosen.length<per&&rest.length) chosen.push(rest.shift()); }
    chosen.forEach(s=>used.add(s.id));
    if(chosen.length<per){ const fill=[...MARKETS.filter(m=>wd===null||m.days.includes(wd)).map(m=>({id:m.id,he:m.he,lat:m.lat,lng:m.lng,dur:1.2,type:"market"})),...SHOPPING.filter(s=>s.lat).map(s=>({id:s.id,he:s.he,lat:s.lat,lng:s.lng,dur:1.5,type:"shop"}))].filter(x=>!used.has(x.id)); fill.sort((a,b)=>km(org,a)-km(org,b)); while(chosen.length<Math.min(per,3)&&fill.length){ const f=fill.shift(); used.add(f.id); chosen.push(f); } }
    // סדר: הקרוב ביותר ל-מוצא ואז שכן קרוב
    const ordered=[]; let cur=org, left=chosen.slice(); while(left.length){ left.sort((a,b)=>km(cur,a)-km(cur,b)); const n=left.shift(); ordered.push(n); cur=n; }
    const stops=ordered.map(s=>s.type?{uid:uid(),type:s.type,refId:s.id,title:s.he,lat:s.lat,lng:s.lng,dur:Math.round(s.dur*60),mode:"metro",note:"",links:[]}:stopFromSite(s,o));
    // ארוחות
    const pickRest=(near,maxLvl)=>{ let a=RESTAURANTS.filter(r=>!usedR.has(r.id)&&r.priceLvl<=maxLvl&&r.priceLvl>=1&&r.id!=="jules"); if(o.interests.includes("jewish")) a.sort((x,y)=>(y.kosher?1:0)-(x.kosher?1:0)); a=a.sort((x,y)=>km(near,x)-km(near,y)+(o.interests.includes("jewish")?(y.kosher?-0.7:0)-(x.kosher?-0.7:0):0)); return a[0]; };
    if(stops.length>=2){ const r=pickRest(stops[Math.min(1,stops.length-1)],o.walk==="low"||hasKids?2:3); if(r){ usedR.add(r.id); stops.splice(Math.min(2,stops.length),0,restStop(r,"ארוחת צהריים")); } }
    if(stops.length>=2){ const last=stops[stops.length-1], r=pickRest(last,3); if(r){ usedR.add(r.id); stops.push(restStop(r,"ארוחת ערב")); } }
    day.stops=stops;
  });
  const route={ id:uid(), name:o.name||"המסלול שלי בפריז", created:Date.now(), opts:o, origin:org, days, links:[] };
  recalc(route); return route;
}
function stopFromSite(s,o){ return {uid:uid(),type:"site",refId:s.id,title:s.he,lat:s.lat,lng:s.lng,dur:Math.round((s.dur||1)*60),mode:"metro",note:s.advance?"להזמין כרטיס/משבצת זמן מראש":"",links:[]}; }
function restStop(r,label){ return {uid:uid(),type:"rest",refId:r.id,title:label+": "+r.he,lat:r.lat,lng:r.lng,dur:label.includes("צהריים")?70:100,mode:"metro",note:r.price,links:[]}; }
function recalc(route){
  route.days.forEach(day=>{
    let t=9*60+30, cur=route.origin;
    day.stops.forEach((s,i)=>{
      const d=km(cur,s); if(!s.mode||s.auto!==false&&!s.modeSet) s.mode=autoMode(d,route.opts||{});
      s.dist=d; s.legMin=legMinutes(s.mode,d); t+= s.legMin;
      if(s.type==="rest"&&s.title.includes("צהריים")&&t<12*60+30) t=12*60+30;
      if(s.type==="rest"&&s.title.includes("ערב")&&t<19*60) t=19*60;
      if(s.fixed) t=toMin(s.time); else { t=Math.ceil(t/5)*5; s.time=hm(t); }
      t+= s.dur||60; cur=s;
    });
  });
}
function routeText(r){
  let o=`${r.name}\nנוצר באפליקציה: פריז, צרפת – מידע למטייל (יוצר: יעקב זוהר)\nנקודת יציאה: ${r.origin.name}\n`;
  r.days.forEach((d,i)=>{ const dt=d.date?fromIso(d.date):null; o+=`\n=== יום ${i+1}${dt?` – ${WD[dt.getDay()]} ${fmtDMY(dt)}`:""} ===\n`;
    if(d.date){ const w=weatherFor(d.date); if(w) o+=`מזג אוויר: ${WMO(w.code)[1]} ${Math.round(w.tmin)}°–${Math.round(w.tmax)}°, גשם ${w.pop??0}%\n`; }
    d.stops.forEach((s,j)=>{ o+=`${s.time}  ${s.title}  (${MODES[s.mode][1]} · ${s.dist.toFixed(1)} ק״מ · ${s.legMin} דק׳ · שהות ${s.dur} דק׳)\n`; if(s.note) o+=`   הערה: ${s.note}\n`; (s.links||[]).forEach(l=>o+=`   קישור: ${l.title} – ${l.url} ${l.desc||""}\n`); }); if(d.note) o+=`הערות היום: ${d.note}\n`; });
  if((r.links||[]).length){ o+="\nמסמכים וקישורים:\n"; r.links.forEach(l=>o+=`- ${l.title}: ${l.url} ${l.desc||""}\n`); }
  return o;
}

  $("#eDel").onclick=()=>{ if(confirm("למחוק את המסלול?")){ store.set("routes",store.get("routes",[]).filter(x=>x.id!==route.id)); back(); } };
  $("#ePrint").onclick=()=>{ document.body.classList.add("printing"); setTimeout(()=>{ map.invalidateSize(); window.print(); },300); const off=()=>{ document.body.classList.remove("printing"); window.removeEventListener("afterprint",off); }; window.addEventListener("afterprint",off); };
  $("#eFile").onclick=()=>openModal("שמירה כקובץ",`<div class="bar"><button class="btn" id="fJ">קובץ מסלול (JSON – אפשר לייבא שוב)</button><button class="btn alt" id="fT">קובץ טקסט לקריאה</button></div><div class="note">ייפתח חלון לבחירת שם הקובץ והתיקייה.</div>`,mb=>{
    const base=(route.name||"מסלול-פריז").replace(/[\\/:*?"<>|]/g,"-");
    $("#fJ",mb).onclick=()=>{ closeModal(); saveFile(base+".json",new Blob([JSON.stringify(route,null,1)],{type:"application/json"}),"application/json"); };
    $("#fT",mb).onclick=()=>{ closeModal(); saveFile(base+".txt",new Blob(["﻿"+routeText(route)],{type:"text/plain"}),"text/plain"); }; });
  $("#eShare").onclick=async()=>{ const t=routeText(route); try{ if(navigator.share){ await navigator.share({title:route.name,text:t}); } else { await navigator.clipboard.writeText(t); toast("המסלול הועתק – הדביקו בהודעה"); } }catch(e){} };
  draw();
}

/* ---------- לשוניות ואתחול ---------- */
const TABS = [
  ["map","🗺️ מפה ואתרים"],["hotels","🏨 מלונות"],["transport","🚇 תחבורה"],["rest","🍽️ מסעדות"],
  ["food","🥐 אוכל מקומי"],["shop","🛍️ קניות"],["markets","🧺 שווקים"],["tips","💡 טיפים"],
  ["routes","🧭 מסלולים"],["areas","🏘️ איפה לישון"],["events","🎭 אירועים"]
];
let CUR = null;
function showTab(name){
  if(!views[name]) name="map";
  CUR=name; store.set("tab",name);
  $$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===name));
  const main=$("#main"); main.innerHTML="";
  try{ views[name](main); }catch(e){ console.error(e); main.innerHTML=`<div class="note">משהו השתבש בטעינת המסך. נסו לרענן (כפתור 🔄 למעלה).</div>`; }
  try{ hydratePhotos(main); }catch(e){}
  window.scrollTo(0,0);
  const b=$(`#tabs button[data-t="${name}"]`); if(b&&b.scrollIntoView) b.scrollIntoView({inline:"center",block:"nearest"});
}
function buildTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-t="${k}">${l}</button>`).join("");
  $$("#tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
}
async function refreshAll(){
  const btn=$("#refreshBtn"); btn.disabled=true; btn.textContent="⏳";
  ["wx","photos","events"].forEach(k=>store.set(k,null));
  Object.keys(PH).forEach(k=>delete PH[k]);
  try{
    if("serviceWorker" in navigator){ const r=await navigator.serviceWorker.getRegistration(); if(r) await r.update(); }
    await loadWeather(true); renderWeather();
  }catch(e){}
  showTab(CUR||"map");
  btn.disabled=false; btn.textContent="🔄";
  const n=new Date(); toast(`התעדכן ב-${fmtDMY(n)} ${pad(n.getHours())}:${pad(n.getMinutes())}`);
}
async function init(){
  buildTabs();
  $("#refreshBtn").onclick=refreshAll;
  $("#ver").textContent="גרסה "+APP_VERSION;
  renderWeather();
  showTab(store.get("tab","map"));
  await loadWeather(); renderWeather();
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
}
document.addEventListener("DOMContentLoaded",init);

</script>
